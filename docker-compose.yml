# TP5: o sistema inteiro num comando.
#
#   docker compose up -d --build        # sobe tudo (primeira vez: alguns minutos)
#   ./scripts/smoke-test.sh             # prova de ponta a ponta
#   docker compose down -v              # derruba e apaga os volumes
#
# Enderecos:
#   http://localhost:3000   front (nginx; /api vai pro gateway)
#   http://localhost:8090   API Gateway
#   http://localhost:8761   Eureka          http://localhost:15672  RabbitMQ (guest/guest)
#   http://localhost:9411   Zipkin          http://localhost:9090   Prometheus
#   http://localhost:3001   Grafana (admin/admin)
#
# Portas do host sao variaveis (ex.: EUREKA_HOST_PORT=18761) pra conviver com
# outros projetos na mesma maquina; os valores acima sao os padroes.
#
# Ordem de subida garantida por healthcheck (depends_on: service_healthy), e nao
# por sleep: postgres/rabbitmq -> config-server -> discovery-server -> servicos
# -> gateway -> front.

name: gamelog

x-java-service: &java-service
  restart: unless-stopped
  environment: &java-env
    CONFIG_SERVER_URL: http://config-server:8888
    EUREKA_URL: http://discovery-server:8761/eureka/
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-gamelog}
    RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-gamelog}
    ZIPKIN_URL: http://zipkin:9411/api/v2/spans
    LOKI_URL: http://loki:3100/loki/api/v1/push
    SPRING_PROFILES_ACTIVE: loki
    DB_USERNAME: ${POSTGRES_USER:-gamelog}
    DB_PASSWORD: ${POSTGRES_PASSWORD:-gamelog}
  deploy:
    resources:
      limits:
        memory: 768m

x-java-healthcheck: &java-healthcheck
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 60s

services:
  # ------------------------------------------------------------------ dados
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gamelog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gamelog}
      POSTGRES_DB: gamelog
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Um banco por servico, no mesmo servidor. Nenhum servico le tabela de outro.
      - ./ops/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d gamelog"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-gamelog}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-gamelog}
    ports:
      - "${RABBITMQ_HOST_PORT:-5672}:5672"
      - "${RABBITMQ_UI_HOST_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12

  # ---------------------------------------------------------- observabilidade
  zipkin:
    image: openzipkin/zipkin:3
    restart: unless-stopped
    ports:
      - "${ZIPKIN_HOST_PORT:-9411}:9411"

  loki:
    image: grafana/loki:3.1.1
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "${LOKI_HOST_PORT:-3100}:3100"

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      ZIPKIN_URL: http://zipkin:9411
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_HOST_PORT:-3001}:3000"
    depends_on:
      - prometheus
      - loki
      - zipkin

  # ------------------------------------------------------------- plataforma
  config-server:
    <<: *java-service
    build: { context: ., args: { MODULE: platform/config-server } }
    image: ${REGISTRY:-gamelog}/config-server:${TAG:-dev}
    environment:
      <<: *java-env
      # A variavel SUBSTITUI a lista do application.yml; sem "native" aqui o
      # Config Server cai no backend Git e nao sobe.
      SPRING_PROFILES_ACTIVE: native,loki
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8888/actuator/health/readiness"]
    depends_on:
      loki: { condition: service_started }

  discovery-server:
    <<: *java-service
    build: { context: ., args: { MODULE: platform/discovery-server } }
    image: ${REGISTRY:-gamelog}/discovery-server:${TAG:-dev}
    ports:
      - "${EUREKA_HOST_PORT:-8761}:8761"
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health/readiness"]
    depends_on:
      config-server: { condition: service_healthy }

  # ------------------------------------------------------------- negocio
  gamelog:
    <<: *java-service
    build: { context: ., args: { MODULE: services/gamelog } }
    image: ${REGISTRY:-gamelog}/gamelog:${TAG:-dev}
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/gamelog
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-em-producao-0123456789abcdef}
      RAWG_API_KEY: ${RAWG_API_KEY:-}
    volumes:
      # Imagens enviadas pelos usuarios sobrevivem a recriacao do container.
      - gamelog-uploads:/app/uploads
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
    depends_on: &business-deps
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      discovery-server: { condition: service_healthy }

  recommendation-service:
    <<: *java-service
    build: { context: ., args: { MODULE: services/recommendation-service } }
    image: ${REGISTRY:-gamelog}/recommendation-service:${TAG:-dev}
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/recommendations
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health/readiness"]
    depends_on: *business-deps

  notification-service:
    <<: *java-service
    build: { context: ., args: { MODULE: services/notification-service } }
    image: ${REGISTRY:-gamelog}/notification-service:${TAG:-dev}
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/notifications
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health/readiness"]
    depends_on: *business-deps

  # ------------------------------------------------------------- entrada
  api-gateway:
    <<: *java-service
    build: { context: ., args: { MODULE: platform/api-gateway } }
    image: ${REGISTRY:-gamelog}/api-gateway:${TAG:-dev}
    environment:
      <<: *java-env
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "${GATEWAY_HOST_PORT:-8090}:8090"
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/actuator/health/readiness"]
    depends_on:
      discovery-server: { condition: service_healthy }

  frontend:
    build: { context: ./frontend }
    image: ${REGISTRY:-gamelog}/frontend:${TAG:-dev}
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
    depends_on:
      api-gateway: { condition: service_healthy }

volumes:
  postgres-data:
  rabbitmq-data:
  gamelog-uploads:
