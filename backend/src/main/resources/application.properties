# Nome da aplicacao e porta onde o back-end sobe.
# Atencao: com o TP3 o spring.application.name deixou de ser so um rotulo nos
# logs. E o NOME pelo qual o monolito se registra no Eureka, e e por esse nome
# que o microsservico de recomendacoes e o gateway o encontram (lb://gamelog).
# Mudar aqui exige mudar nos dois lados.
spring.application.name=gamelog
server.port=8080

# --- Spring Cloud (TP3) ---
# Busca a configuracao no Config Server durante o startup.
#
# O "optional:" e uma decisao de projeto, nao um detalhe: sem ele, o monolito
# passaria a NAO SUBIR se o Config Server estivesse fora do ar. Como este
# projeto tambem tem que continuar rodando com um simples
# "cd backend && mvn spring-boot:run" - do jeito que o README sempre documentou -
# a stack distribuida e um acrescimo, nao um pre-requisito. Sem Config Server, o
# monolito registra um aviso e usa os valores deste arquivo.
spring.config.import=optional:configserver:http://localhost:8888

# Onde se registrar. Normalmente vem do config-repo/application.yml; fica aqui
# como reserva pro caso de o Config Server nao responder.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Expoe o health check que o Eureka e o gateway consultam.
management.endpoints.web.exposure.include=health,info

# Banco H2 persistido em ARQUIVO (pasta backend/data). Diferente do TP1, que
# usava banco em memoria, agora os dados sobrevivem ao restart da aplicacao -
# uma camada de persistencia de verdade. Pra inspecionar, use o console H2.
spring.datasource.url=jdbc:h2:file:./data/gamelog;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# update: o Hibernate cria as tabelas que faltam e adiciona colunas novas, mas
# nunca apaga nada. E o que faz sentido com banco em arquivo (create-drop
# apagaria os dados a cada restart). Em producao o ideal seria uma ferramenta
# de migracao (Flyway/Liquibase), mas pro escopo do projeto o update basta.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Desliga o "Open Session in View": a sessao do Hibernate fecha quando o
# service termina, nao quando a resposta HTTP e enviada. Isso obriga todo
# acesso a dados a acontecer dentro de @Transactional (mais previsivel) e
# libera a conexao do pool mais cedo (melhor sob carga).
spring.jpa.open-in-view=false

# --- Historico (Hibernate Envers) ---
# Sufixo das tabelas de auditoria: reviews -> reviews_aud.
spring.jpa.properties.org.hibernate.envers.audit_table_suffix=_aud
# Guarda o estado completo da entidade tambem na revisao de DELETE. Assim o
# historico mostra COMO a review estava quando foi apagada, nao so que sumiu.
spring.jpa.properties.org.hibernate.envers.store_data_at_delete=true

# Console web do H2 em http://localhost:8080/h2-console (util pra inspecionar dados)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Chave usada pra assinar os tokens JWT (minimo 32 bytes por causa do HS256).
# Vem da variavel de ambiente JWT_SECRET; o valor de fallback e SO pra
# desenvolvimento local e nao protege nada em producao.
app.jwt.secret=${JWT_SECRET:chave-de-desenvolvimento-nao-usar-em-producao-0123456789abcdef}
# Validade do token: 24 horas (em milissegundos)
app.jwt.expiration-ms=86400000

# API externa de jogos (RAWG). A chave vem da variavel de ambiente
# RAWG_API_KEY e NAO fica no repositorio. Sem chave, o import falha de leve
# e o seeder cai pra lista local de jogos - a aplicacao funciona do mesmo jeito.
app.rawg.base-url=https://api.rawg.io/api
app.rawg.key=${RAWG_API_KEY:}
