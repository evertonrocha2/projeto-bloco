# Nome da aplicacao e porta onde o back-end sobe
spring.application.name=gamelog
server.port=8080

# Banco H2 em memoria. DB_CLOSE_DELAY=-1 mantem o banco vivo enquanto a app roda.
spring.datasource.url=jdbc:h2:mem:gamelog;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# create-drop: o Hibernate cria as tabelas ao subir e apaga ao desligar.
# Como o banco e em memoria, isso e exatamente o que a gente quer.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Console web do H2 em http://localhost:8080/h2-console (util pra inspecionar dados)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Chave secreta usada pra assinar os tokens JWT. Precisa ter pelo menos 32 bytes
# por causa do algoritmo HS256. Em producao isso viria de uma variavel de ambiente.
app.jwt.secret=${JWT_SECRET:chave-de-desenvolvimento-nao-usar-em-producao-0123456789abcdef}
# Validade do token: 24 horas (em milissegundos)
app.jwt.expiration-ms=86400000

# API externa de jogos (RAWG). A chave pode ser sobrescrita por variavel de
# ambiente RAWG_API_KEY (ex: em producao), caindo pra essa de desenvolvimento
# se nao existir.
app.rawg.base-url=https://api.rawg.io/api
app.rawg.key=${RAWG_API_KEY:}
