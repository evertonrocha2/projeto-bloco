# Prometheus no Kubernetes. Mesmas regras de alerta do compose (alerts.yml); o
# que muda e COMO os alvos sao achados: em vez de nomes fixos, o Prometheus
# pergunta a API do Kubernetes quais pods existem e raspa os que tem a anotacao
# prometheus.io/scrape=true. Uma replica nova do recommendation-service criada
# pelo HPA entra no painel sozinha, sem editar este arquivo.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: spring
    kubernetes_sd_configs:
      - role: pod
        namespaces: { names: [gamelog] }
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs:
      - targets: [rabbitmq:15692]
