# Prometheus do docker compose. (No Kubernetes a mesma lista vem de um ConfigMap,
# com descoberta por pod em vez de DNS - ver k8s/base/observability.)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # dns_sd em vez de endereco fixo: com "docker compose up --scale
  # recommendation-service=3", o nome resolve pras tres instancias e cada uma
  # e raspada separadamente (label instance diferente).
  - job_name: spring
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - { names: [gamelog], type: A, port: 8080 }
      - { names: [recommendation-service], type: A, port: 8081 }
      - { names: [notification-service], type: A, port: 8082 }
      - { names: [api-gateway], type: A, port: 8090 }
      - { names: [config-server], type: A, port: 8888 }
      - { names: [discovery-server], type: A, port: 8761 }

  # Plugin rabbitmq_prometheus (ligado por padrao na imagem). O endpoint
  # per-object traz metricas POR FILA - profundidade da DLQ, por exemplo.
  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs:
      - targets: [rabbitmq:15692]
