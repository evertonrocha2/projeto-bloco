# Os MESMOS arquivos que o docker compose monta viram ConfigMaps no Kubernetes.
# Um painel do Grafana ou uma regra de alerta editados aqui valem pros dois
# ambientes - nao existe copia pra divergir. (k8s/base inclui este diretorio.)
#
# O sufixo de hash que o kustomize poe no nome faz o Deployment que monta o
# ConfigMap reiniciar quando o conteudo muda: editou o alerta, o Prometheus sobe
# de novo com a regra nova.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configMapGenerator:
  - name: postgres-init
    files:
      - 01-databases.sql=postgres/init-databases.sql
  - name: prometheus-config
    files:
      # Descoberta de alvos e diferente (pods, e nao DNS do compose); o resto e igual.
      - prometheus.yml=prometheus/prometheus-k8s.yml
      - alerts.yml=prometheus/alerts.yml
  - name: grafana-datasources
    files:
      - datasources.yml=grafana/provisioning/datasources/datasources.yml
  - name: grafana-dashboard-provider
    files:
      - dashboards.yml=grafana/provisioning/dashboards/dashboards.yml
  - name: grafana-dashboards
    files:
      - gamelog.json=grafana/dashboards/gamelog.json
