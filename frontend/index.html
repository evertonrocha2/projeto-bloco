<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GameLog - registre, avalie e descubra jogos." />
    <title>GAMELOG // sua estante de jogos</title>

    <!-- Sistema de quatro fontes do Google Fonts, uma por papel:
         - Prosto One  : os h1. Display largo, feita pra corpo grande.
         - Silkscreen  : micro-rotulos. Pixel font, so funciona em corpo pequeno.
         - Silkscreen  : micro-rotulos e pontuacao. Pixel font - so funciona em
                         corpo pequeno, e e ela que da o ar retro-gamer.
         - DM Sans     : texto corrido.
         As tres primeiras foram conferidas: tem TODOS os acentos do portugues.
         Se nao carregarem (sem internet), cai pra fonte do sistema. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Prosto+One&family=Silkscreen:wght@400;700&family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400&display=swap"
      rel="stylesheet"
    />

    <!-- BBH Sans Bartle e usada SO na marca "GameLog". A fonte nao tem nenhum
         caractere acentuado (121 glifos, ASCII apenas), entao em texto em
         portugues ela renderizaria com letras de outra fonte no meio das
         palavras. Na marca, que e ASCII puro, isso nao acontece.
         Vem do Fontsource porque nao esta no Google Fonts. -->
    <style>
      @font-face {
        font-family: 'BBH Sans Bartle';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url(https://cdn.jsdelivr.net/fontsource/fonts/bbh-sans-bartle@latest/latin-400-normal.woff2) format('woff2'),
             url(https://cdn.jsdelivr.net/fontsource/fonts/bbh-sans-bartle@latest/latin-400-normal.woff) format('woff');
      }
    </style>
  </head>
  <body>
    <!-- O React monta a aplicacao inteira dentro dessa div -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
