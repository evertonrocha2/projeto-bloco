apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: NodePort
  ports:
    - { name: http, port: 80, targetPort: http, nodePort: 30000 }
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  type: NodePort
  ports:
    - { name: http, port: 8090, nodePort: 30080 }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  type: NodePort
  ports:
    - { name: http, port: 3000, nodePort: 30001 }
---
apiVersion: v1
kind: Service
metadata:
  name: zipkin
spec:
  type: NodePort
  ports:
    - { name: http, port: 9411, nodePort: 30411 }
