# Recomendacoes. Sem estado local (o banco e o Postgres), entao escala na
# horizontal. Com N replicas:
#   - a fila recommendation.recalculate tem N x 2-4 consumidores concorrentes;
#   - a fila de eventos (single active consumer) continua com UM consumidor
#     ativo - as outras replicas ficam de reserva e assumem se ele cair.
apiVersion: v1
kind: Service
metadata:
  name: recommendation-service
spec:
  selector: { app: recommendation-service }
  ports:
    - { name: http, port: 8081 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-service
spec:
  replicas: 2
  selector:
    matchLabels: { app: recommendation-service }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: recommendation-service }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8081"
    spec:
      securityContext: { runAsNonRoot: true }
      terminationGracePeriodSeconds: 45
      containers:
        - name: recommendation-service
          image: gamelog/recommendation-service:dev
          ports:
            - { name: http, containerPort: 8081 }
          envFrom:
            - configMapRef: { name: gamelog-env }
          env:
            - { name: DB_URL, value: "jdbc:postgresql://postgres:5432/recommendations" }
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: gamelog-secrets, key: DB_USERNAME } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: gamelog-secrets, key: DB_PASSWORD } }
            - name: RABBITMQ_USERNAME
              valueFrom: { secretKeyRef: { name: gamelog-secrets, key: RABBITMQ_USERNAME } }
            - name: RABBITMQ_PASSWORD
              valueFrom: { secretKeyRef: { name: gamelog-secrets, key: RABBITMQ_PASSWORD } }
          # Saida limpa do balanceamento: marca a instancia DOWN no Eureka e espera
          # os caches dos clientes (5 s de registro + 5 s do load balancer) antes
          # de o SIGTERM chegar. Sem isto o Spring para o servidor web ANTES de se
          # desregistrar, e o gateway ainda manda requisicao pro pod que saiu
          # (medido: 2 de 8 leituras com erro durante um rollout).
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "wget -q -O /dev/null --header 'Content-Type: application/json' --post-data '{\"status\":\"DOWN\"}' http://127.0.0.1:8081/actuator/serviceregistry; sleep 12"]
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 150m, memory: 384Mi }
            limits: { memory: 768Mi }
          securityContext: { allowPrivilegeEscalation: false }
