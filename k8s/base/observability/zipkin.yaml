# Zipkin com armazenamento em memoria: os traces somem num restart. Pra
# demonstracao e investigacao do momento, basta; em producao o storage seria
# Elasticsearch/Cassandra (ou o Tempo, se a stack for toda Grafana).
apiVersion: v1
kind: Service
metadata:
  name: zipkin
spec:
  selector: { app: zipkin }
  ports:
    - { name: http, port: 9411 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipkin
spec:
  replicas: 1
  selector:
    matchLabels: { app: zipkin }
  template:
    metadata:
      labels: { app: zipkin }
    spec:
      containers:
        - name: zipkin
          image: openzipkin/zipkin:3
          ports:
            - { name: http, containerPort: 9411 }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 512Mi }
