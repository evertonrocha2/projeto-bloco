# Configuracao COMUM a todos os servicos que pedem config pro Config Server.
# O nome "application" e especial: o Config Server serve este arquivo pra
# qualquer cliente, independente do nome da aplicacao. O arquivo especifico do
# servico (ex: recommendation-service.yml) tem prioridade sobre este.
#
# Antes do TP3 cada aplicacao carregaria a sua propria copia destes valores. Com
# a configuracao centralizada, mudar o endereco do Eureka - por exemplo - e uma
# edicao em UM arquivo, e nao uma cacada em cinco.

eureka:
  client:
    service-url:
      # Onde os servicos se registram e onde procuram uns aos outros.
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    # Em ambiente local o hostname da maquina as vezes nao resolve; o IP e mais
    # confiavel pra um servico achar o outro.
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        # health: usado pra saber se o servico esta de pe.
        # refresh: e o que permite recarregar a configuracao sem reiniciar.
        include: health,info,refresh
  endpoint:
    health:
      show-details: always

# TP4: broker comum a todos os servicos que trocam eventos. As variaveis de
# ambiente (Docker/Kubernetes) tem prioridade; o padrao serve pro ambiente local.
spring:
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
