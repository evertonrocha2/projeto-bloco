# Configuracao do microsservico de recomendacoes.
#
# Estes numeros sao a regra de negocio do algoritmo, e o motivo de estarem AQUI
# e nao no codigo: junto com @RefreshScope no ScoringProperties, editar este
# arquivo e chamar POST /actuator/refresh muda como as recomendacoes sao
# calculadas SEM recompilar e SEM reiniciar o servico. E a demonstracao concreta
# do que "configuracao distribuida" resolve.

recommendation:
  scoring:
    # Nota minima pra considerar que o usuario GOSTOU do jogo. Abaixo disso a
    # avaliacao nao contribui pro perfil de gosto (mas ainda exclui o jogo das
    # recomendacoes, porque ele ja foi jogado).
    min-rating: 3
    # Peso de um jogo que esta so na colecao, sem avaliacao. Vale menos que uma
    # nota alta: ter o jogo diz menos sobre gosto do que ter gostado dele.
    collection-weight: 0.5
    # Reforco aplicado ao genero de um jogo que o usuario marcou como "gostei"
    # na propria tela de recomendacoes.
    liked-boost: 1.5
    # Quanto a afinidade de genero pesa no score final (max 3.0 de 5.0).
    genre-weight: 3.0
    # Quanto a nota media da comunidade pesa no score final (max 2.0 de 5.0).
    community-weight: 2.0
    # Quantas recomendacoes devolver.
    max-results: 8

# TP4: o circuit breaker (Resilience4j) que protegia a chamada HTTP ao monolito
# saiu junto com a chamada. Com eventos, o monolito fora do ar nao gera timeout
# aqui: as mensagens simplesmente esperam na fila do RabbitMQ.
app:
  recalculation:
    concurrency: 2-4
  messaging:
    retry:
      # Tentativas locais antes de a mensagem ir pra DLQ.
      max-attempts: 3
      initial-interval-ms: 500
