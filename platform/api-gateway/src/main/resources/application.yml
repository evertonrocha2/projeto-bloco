# API Gateway: a porta unica de entrada do sistema.
#
# O front conhece UM endereco (localhost:8090) e nao sabe quantos servicos existem
# atras dele. Sem gateway, o api.js precisaria de uma URL por servico e mudaria a
# cada servico novo; e o navegador precisaria de CORS configurado em cada um.
server:
  port: 8090

spring:
  application:
    name: api-gateway

  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

  cloud:
    gateway:
      default-filters:
        # Remove headers de CORS repetidos antes de responder ao navegador.
        #
        # Por que e necessario: o monolito configura CORS por conta propria desde o
        # TP1 (o front chamava a 8080 direto), e o gateway tambem configura, porque
        # agora e ele que o navegador ve. Nas rotas do monolito a resposta saia com
        # Access-Control-Allow-Origin DUAS VEZES.
        #
        # O efeito e pior do que parece: o navegador nao aceita o header repetido,
        # ele RECUSA a resposta inteira ("contains multiple values, but only one is
        # allowed"). Testando com curl aparecia HTTP 200 e o JSON correto - e o
        # catalogo simplesmente nao carregava em tela nenhuma.
        #
        # RETAIN_UNIQUE mantem uma ocorrencia de cada valor. Alternativa seria tirar
        # o CORS do monolito, mas ai apontar o front direto pra 8080 (via
        # VITE_API_URL, como o README documenta) pararia de funcionar.
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

        # TP5: repete GET que falhou por conexao recusada ou 502/503 - cada
        # tentativa passa pelo load balancer de novo e tende a cair em OUTRA
        # instancia. Cobre a janela em que uma instancia esta saindo (deploy,
        # scale down) e o registro ainda nao refletiu. So GET: repetir um POST
        # poderia criar a mesma review duas vezes.
        - name: Retry
          args:
            retries: 2
            methods: GET
            statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE
            exceptions: java.io.IOException,java.util.concurrent.TimeoutException
            backoff:
              firstBackoff: 100ms
              maxBackoff: 500ms
              factor: 2

      # As ROTAS ficam neste arquivo local, e nao no Config Server, de proposito:
      # sem elas o gateway sobe sem saber rotear nada, e o sistema inteiro fica
      # inacessivel. Uma dependencia dessa gravidade na inicializacao nao vale a
      # centralizacao. O que ganha de fato com configuracao central sao os valores
      # ajustaveis em tempo de execucao (os pesos do algoritmo), e nao a topologia.
      routes:
        # A ORDEM IMPORTA. /api/** casaria com /api/recommendations/** tambem, entao
        # a rota especifica tem que ser avaliada primeiro. Os campos "order"
        # explicitos deixam isso garantido em vez de depender da ordem do arquivo.
        - id: recommendation-service
          # lb:// = resolve pelo nome no Eureka e balanceia entre as instancias.
          # Nao existe host nem porta escrita em lugar nenhum.
          uri: lb://recommendation-service
          order: 0
          predicates:
            - Path=/api/recommendations/**

        # TP4: o segundo consumidor dos eventos do monolito. Mesma regra de
        # ordem da rota acima.
        - id: notification-service
          uri: lb://notification-service
          order: 0
          predicates:
            - Path=/api/notifications/**

        - id: gamelog-monolith
          uri: lb://gamelog
          order: 1
          predicates:
            - Path=/api/**

      globalcors:
        cors-configurations:
          '[/**]':
            # CORS resolvido AQUI, num lugar so. Como o navegador so conversa com o
            # gateway, os servicos de tras nao precisam saber que existe um front em
            # outra porta.
            # TP5: lista separada por virgula, vinda do ambiente. Em Docker o front
            # e servido pelo nginx na mesma origem da API e o CORS nem entra em jogo;
            # a lista so importa pro Vite em desenvolvimento.
            allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
            allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowedHeaders: "*"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        # gateway: lista as rotas ativas em /actuator/gateway/routes - util pra
        # conferir o roteamento numa demonstracao.
        include: health,info,gateway,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
