# Servico de notificacoes (TP4).
server:
  port: 8082

spring:
  application:
    name: notification-service

  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

  # Banco proprio, como o recommendation-service.
  # TP5: PostgreSQL em Docker/Kubernetes, via DB_URL (driver deduzido pela URL).
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/notifications;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    listener:
      simple:
        prefetch: 10

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

app:
  messaging:
    retry:
      max-attempts: 3
      initial-interval-ms: 500
