# Servico de notificacoes (TP4).
server:
  port: 8082

spring:
  application:
    name: notification-service

  config:
    import: optional:configserver:http://localhost:8888

  # Banco proprio, como o recommendation-service.
  datasource:
    url: jdbc:h2:file:./data/notifications;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  rabbitmq:
    host: localhost
    port: 5672
    listener:
      simple:
        prefetch: 10

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh
  endpoint:
    health:
      show-details: always

app:
  messaging:
    retry:
      max-attempts: 3
      initial-interval-ms: 500
