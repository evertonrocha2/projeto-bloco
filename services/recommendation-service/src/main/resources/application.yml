# Microsservico de recomendacoes.
server:
  port: 8081

spring:
  application:
    # Nome com que ele se registra no Eureka. O gateway roteia
    # /api/recommendations/** pra lb://recommendation-service usando este nome.
    name: recommendation-service

  config:
    # optional: sobe mesmo sem o Config Server, usando os valores deste arquivo.
    import: optional:configserver:http://localhost:8888

  # === BANCO PROPRIO ===
  # Arquivo separado do banco do monolito (que fica em services/gamelog/data).
  # As tabelas daqui (recommendations, recommendation_feedback e, desde o TP4, a
  # projecao: catalog_games, user_ratings, user_collection, processed_events) nao
  # existem no monolito, e as dele nao existem aqui.
  datasource:
    url: jdbc:h2:file:./data/recommendations;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

  # === Mensageria (TP4) ===
  # Em Docker/Kubernetes o endereco vem de SPRING_RABBITMQ_HOST.
  rabbitmq:
    host: localhost
    port: 5672
    template:
      # Quanto o pedido de snapshot espera pela resposta do monolito. Passou disso,
      # o monolito esta fora e a tentativa se repete no proximo ciclo.
      reply-timeout: 10s
    listener:
      simple:
        # Quantas mensagens o broker entrega adiantado pra cada consumidor. Baixo
        # de proposito: com prefetch alto, um consumidor lento seguraria mensagens
        # que outro consumidor ocioso poderia estar processando.
        prefetch: 10

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh
  endpoint:
    health:
      show-details: always

# --- Valores de reserva ---
# Normalmente estes numeros vem do Config Server (config-repo/recommendation-service.yml),
# que tem prioridade sobre este arquivo. Ficam duplicados aqui de proposito: sem
# eles, subir o servico sem o Config Server daria pesos zerados e recomendacao
# nenhuma - falha silenciosa, o pior tipo.
recommendation:
  scoring:
    min-rating: 3
    collection-weight: 0.5
    liked-boost: 1.5
    genre-weight: 3.0
    community-weight: 2.0
    max-results: 8

app:
  recalculation:
    # Consumidores da fila de recalculo por instancia (minimo-maximo).
    concurrency: 2-4
  messaging:
    retry:
      max-attempts: 3
      initial-interval-ms: 500
